name: Feature request
description: Propose a new capability or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please focus on the problem, motivation, and expected outcome.
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem would this solve, and who is affected?
      placeholder: Describe the user need or workflow gap.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
      placeholder: Describe the desired behavior or API.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you considered?
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which area does this request affect?
      options:
        - User experience
        - API or integration
        - Documentation
        - Developer tooling
        - Security or privacy
        - Other
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, links, examples, or other useful context.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for similar requests.
          required: true
        - label: I described the problem or motivation, not only a preferred implementation.
          required: true
